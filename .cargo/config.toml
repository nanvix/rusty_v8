[target.aarch64-linux-android]
linker = "./third_party/android_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"

[target.x86_64-linux-android]
linker = "./third_party/android_ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang++"

[patch.crates-io]
libc = { git = "https://github.com/nanvix/libc", branch = "nanvix/v0.2.174" }
libloading = { git = "https://github.com/nanvix/rust_libloading", branch = "nanvix/v0.8.8" }
errno = { git = "https://github.com/nanvix/rust-errno", branch = "nanvix/v0.3.13" }
fslock = { git = "https://github.com/nanvix/fslock", branch = "nanvix/v0.2.1" }
clang-sys = { git = "https://github.com/nanvix/clang-sys", branch = "nanvix/v1.8.1" }
