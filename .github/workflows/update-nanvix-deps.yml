name: Update Nanvix Dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PATCHED_DEPS: "libc libloading errno fslock clang-sys"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update patched crates
        run: |
          set -euo pipefail
          python update-nanvix-deps.py --deps "$PATCHED_DEPS"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          commit-message: "deps: refresh patched crates"
          title: "deps: refresh patched Nanvix crates"
          body: |
            Automated cargo updates for Nanvix-maintained forks:
            - libc
            - libloading
            - errno
            - fslock
            - clang-sys

            This PR was generated by the update-nanvix-dependencies workflow.
          labels: "dependencies,nanvix-patches"
          branch: "automation/update-nanvix-dependencies"
          delete-branch: false
