name: Update Nanvix Dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    branches:
      - nanvix/**
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - nanvix/**

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover Patched Crates
        id: patched-crates
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import sys

          import tomllib

          config_path = pathlib.Path('.cargo/config.toml')
          data = tomllib.loads(config_path.read_text(encoding='utf-8'))
          patches = data.get('patch', {}).get('crates-io', {})
          if not patches:
              raise SystemExit('No patched crates found in .cargo/config.toml')

          specs = []
          bullet_lines = []
          for name in sorted(patches):
              entry = patches.get(name) or {}
              branch = str(entry.get('branch', ''))
              version_token = branch.rsplit('/', 1)[-1] if branch else ''
              if version_token.startswith('v'):
                  version_token = version_token[1:]

              if not version_token:
                  print(
                      f"Warning: Could not derive version for {name} from branch '{branch}'",
                      file=sys.stderr,
                  )
                  continue

              specs.append(f"{name}@{version_token}")
              bullet_lines.append(f"- {name}")

          if not specs:
              raise SystemExit('No dependency specs could be derived from patches')

          body_path = pathlib.Path('patched-pr-body.md')
          body_text = '\n'.join(
              ['Automated cargo updates for Nanvix-maintained forks:']
              + bullet_lines
              + ['', 'This PR was generated by the update-nanvix-dependencies workflow.']
          )
          body_path.write_text(body_text + '\n', encoding='utf-8')

          specs_str = ' '.join(specs)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"specs={specs_str}\n")
              fh.write(f"body_path={body_path}\n")
          PY

      - name: Update Patched Crates
        env:
          PATCHED_SPECS: ${{ steps.patched-crates.outputs.specs }}
        run: |
          set -euo pipefail
          for spec in $PATCHED_SPECS; do
            echo "Updating $spec…"
            cargo update -p "$spec"
          done

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          commit-message: "deps: refresh patched crates"
          title: "deps: refresh patched Nanvix crates"
          body-path: ${{ steps.patched-crates.outputs.body_path }}
          labels: "enhancement"
          reviewers: ppenna
          assignees: ppenna
          branch: "automation/update-nanvix-dependencies"
          delete-branch: false
