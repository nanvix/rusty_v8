name: Update Nanvix Dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - nanvix/**

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover patched crates
        id: patched-crates
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          config_path = pathlib.Path('.cargo/config.toml')
          data = tomllib.loads(config_path.read_text())
          patches = data.get('patch', {}).get('crates-io', {})
          if not patches:
              raise SystemExit('No patched crates found in .cargo/config.toml')

          deps = ' '.join(sorted(patches))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'deps={deps}\n')
          PY

      - name: Update patched crates
        env:
          PATCHED_DEPS: ${{ steps.patched-crates.outputs.deps }}
        run: |
          set -euo pipefail
          python update-nanvix-deps.py --deps "$PATCHED_DEPS"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          commit-message: "deps: refresh patched crates"
          title: "deps: refresh patched Nanvix crates"
          body: |
            Automated cargo updates for Nanvix-maintained forks:
            - libc
            - libloading
            - errno
            - fslock
            - clang-sys

            This PR was generated by the update-nanvix-dependencies workflow.
          labels: "dependencies,nanvix-patches"
          branch: "automation/update-nanvix-dependencies"
          delete-branch: false
