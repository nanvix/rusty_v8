name: Nanvix CI

on:
  # Nightly run ensures long-lived branches do not drift from defaults.
  schedule:
    - cron: "0 0 * * *"
  # Automatically re-sync whenever nanvix/* branches receive direct pushes.
  push:
    branches:
      - nanvix/**
  # Automatically run CI on PRs targeting nanvix/* branches.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - nanvix/**
  # Manual trigger allows running the CI on-demand.
  workflow_dispatch:
  # Automatically trigger on minor/major releases.
  repository_dispatch:
    types: [nanvix-minor-release, nanvix-major-release]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  setup:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download Nanvix Artifacts
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/nanvix-artifacts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/nanvix/nanvix/ccee7b3688925496cb666385a534b14a0268a07b/scripts/get-nanvix.sh | bash -s -- --force "$ARTIFACT_DIR"

      - name: Generate Build Matrix
        id: generate-matrix
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/nanvix-artifacts
        run: |
          set -euo pipefail
          tarballs=$(find "$ARTIFACT_DIR" -maxdepth 1 -name '*.tar.bz2' -printf '%f\n')
          if [[ -z "$tarballs" ]]; then
            echo "::error::No .tar.bz2 artifacts found in $ARTIFACT_DIR"
            exit 1
          fi
          filtered=$(echo "$tarballs" | grep -iE 'microvm|hyperlight' || true)
          if [[ -z "$filtered" ]]; then
            echo "::warning::No eligible artifacts (microvm or hyperlight) found."
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matrix=$(echo "$filtered" | jq -Rc '{artifact_name: .}' | jq -sc '{include: .}')
          echo "Matrix definition: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload Nanvix Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nanvix-artifacts
          path: ${{ github.workspace }}/nanvix-artifacts
          retention-days: 1

  build:
    needs: setup
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Cached Artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-nanvix-${{ matrix.artifact_name }}-${{ github.ref }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nanvix-${{ matrix.artifact_name }}-

      - name: Download Nanvix Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nanvix-artifacts
          path: ${{ github.workspace }}/nanvix-artifacts

      - name: Extract Nanvix Artifact (${{ matrix.artifact_name }})
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/nanvix-artifacts
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          SRC="$ARTIFACT_DIR/$ARTIFACT_NAME"
          if [[ ! -s "$SRC" ]]; then
            echo "::error::Expected artifact not found: $SRC"
            exit 1
          fi
          EXTRACT_DIR="$ARTIFACT_DIR/extracted/${ARTIFACT_NAME//.tar.bz2/}"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          tar -xjf "$SRC" -C "$EXTRACT_DIR"
          echo "EXTRACTED_NANVIX_HOME=$EXTRACT_DIR" >> "$GITHUB_ENV"
          echo "Using extracted Nanvix artifacts from $EXTRACT_DIR"

      - name: Build rusty_v8 for Nanvix
        env:
          LOG_DIR: ${{ github.workspace }}/ci-logs
        run: |
          set -euo pipefail
          : "${EXTRACTED_NANVIX_HOME:?Missing extracted artifact path}"
          LOCAL_TOOLCHAIN="$HOME/toolchain"
          if [[ ! -d "$LOCAL_TOOLCHAIN" ]]; then
            echo "::error::Local Nanvix toolchain not found at $LOCAL_TOOLCHAIN"
            exit 1
          fi
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/make-build-${{ matrix.artifact_name }}.log"
          NANVIX_HOME="${EXTRACTED_NANVIX_HOME}" \
          NANVIX_TOOLCHAIN="$LOCAL_TOOLCHAIN" \
          DOCKER=no \
          VERBOSE=yes \
          make all |& tee "$LOG_FILE"
          echo "Make build logs saved to $LOG_FILE"

      - name: Run Example
        run: |
          set -euo pipefail
          : "${EXTRACTED_NANVIX_HOME:?Missing extracted artifact path}"
          LOCAL_TOOLCHAIN="$HOME/toolchain"
          if [[ ! -d "$LOCAL_TOOLCHAIN" ]]; then
            echo "::error::Local Nanvix toolchain not found at $LOCAL_TOOLCHAIN"
            exit 1
          fi
          NANVIX_HOME="${EXTRACTED_NANVIX_HOME}" \
          NANVIX_TOOLCHAIN="$LOCAL_TOOLCHAIN" \
          DOCKER=no \
          VERBOSE=yes \
          make run

      - name: Cleanup Dangling Resources
        if: always()
        run: |
          set -euo pipefail
          sudo find /tmp -maxdepth 1 -type d -name 'nvx:*' -exec rm -rf {} + 2>/dev/null || true

      - name: Install Artifacts
        run: |
          set -euo pipefail
          : "${EXTRACTED_NANVIX_HOME:?Missing extracted artifact path}"
          LOCAL_TOOLCHAIN="$HOME/toolchain"
          if [[ ! -d "$LOCAL_TOOLCHAIN" ]]; then
            echo "::error::Local Nanvix toolchain not found at $LOCAL_TOOLCHAIN"
            exit 1
          fi
          NANVIX_HOME="${EXTRACTED_NANVIX_HOME}" \
          NANVIX_TOOLCHAIN="$LOCAL_TOOLCHAIN" \
          DOCKER=no \
          VERBOSE=yes \
          make install

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rusty_v8-nanvix-build-${{ matrix.artifact_name }}
          path: |
            ci-logs
            dist
          if-no-files-found: warn

  report-minor-release-failure:
    needs:
      - setup
      - build
    if: >-
      ${{ always() && github.event_name == 'repository_dispatch' &&
          (github.event.action == 'nanvix-minor-release' || github.event.action == 'nanvix-major-release') &&
          (needs.setup.result == 'failure' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isMajor = context.payload.action === 'nanvix-major-release';
            const releaseType = isMajor ? 'major' : 'minor';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Nanvix ${releaseType} release CI failure (run ${context.runNumber})`;
            const body = [
              `The Nanvix ${releaseType} release CI workflow failed.`,
              `- Run: [#${context.runNumber}](${runUrl})`,
              `- SHA: ${context.sha}`,
              `- setup: ${process.env.SETUP_RESULT}`,
              `- build: ${process.env.BUILD_RESULT}`,
              '',
              'Please investigate and take any corrective actions.'
            ].join('\n');
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              assignees: ['ppenna']
            });
