name: Nanvix CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - 'nanvix/**'
  pull_request:
    branches:
      - 'nanvix/**'
  repository_dispatch:
    types: [nanvix-minor-release, nanvix-major-release]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  discover-artifacts:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Discover Artifacts
        id: generate-matrix
        env:
          API_URL: https://api.github.com/repos/nanvix/nanvix/releases/tags/latest
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$API_URL")
          tarballs=$(echo "$response" | jq '[.assets[] | select(.browser_download_url | endswith(".tar.bz2")) | {artifact_name: .name, artifact_url: .browser_download_url}]')
          all_count=$(echo "$tarballs" | jq 'length')
          if [[ "$all_count" -eq 0 ]]; then
            echo "::error::No .tar.bz2 assets were found in the latest Nanvix release."
            exit 1
          fi
          filtered=$(echo "$tarballs" | jq '[.[] | select((.artifact_name | ascii_downcase | contains("microvm")) or (.artifact_name | ascii_downcase | contains("hyperlight"))) ]')
          filtered_count=$(echo "$filtered" | jq 'length')
          if [[ "$filtered_count" -eq 0 ]]; then
            echo "::warning::No eligible artifacts (microvm or hyperlight) found among $all_count .tar.bz2 assets."
            filtered=$(jq -n '[]')
          fi
          matrix=$(echo "$filtered" | jq -c '{include: .}')
          echo "Matrix definition: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover-artifacts
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-artifacts.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Cached Artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-nanvix-${{ matrix.artifact_name }}-${{ github.ref }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-nanvix-${{ matrix.artifact_name }}-

      - name: Download Nanvix Artifact (${{ matrix.artifact_name }})
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/nanvix-artifacts
          ARTIFACT_URL: ${{ matrix.artifact_url }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          DEST="$ARTIFACT_DIR/$ARTIFACT_NAME"
          echo "Downloading $ARTIFACT_URL"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" "$ARTIFACT_URL" -o "$DEST"
          if [[ ! -s "$DEST" ]]; then
            echo "::error::Failed to download $ARTIFACT_URL"
            exit 1
          fi

      - name: Extract Nanvix Artifact (${{ matrix.artifact_name }})
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/nanvix-artifacts
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          set -euo pipefail
          SRC="$ARTIFACT_DIR/$ARTIFACT_NAME"
          EXTRACT_DIR="$ARTIFACT_DIR/extracted/${ARTIFACT_NAME//.tar.bz2/}"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          tar -xjf "$SRC" -C "$EXTRACT_DIR"
          echo "EXTRACTED_NANVIX_HOME=$EXTRACT_DIR" >> "$GITHUB_ENV"
          echo "Using extracted Nanvix artifacts from $EXTRACT_DIR"

      - name: Build rusty_v8 for Nanvix
        env:
          LOG_DIR: ${{ github.workspace }}/ci-logs
        run: |
          set -euo pipefail
          : "${EXTRACTED_NANVIX_HOME:?Missing extracted artifact path}"
          LOCAL_TOOLCHAIN="$HOME/toolchain"
          if [[ ! -d "$LOCAL_TOOLCHAIN" ]]; then
            echo "::error::Local Nanvix toolchain not found at $LOCAL_TOOLCHAIN"
            exit 1
          fi
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/make-build-${{ matrix.artifact_name }}.log"
          NANVIX_HOME="${EXTRACTED_NANVIX_HOME}" \
          NANVIX_TOOLCHAIN="$LOCAL_TOOLCHAIN" \
          DOCKER=no \
          VERBOSE=yes \
          make all |& tee "$LOG_FILE"
          echo "Make build logs saved to $LOG_FILE"

      - name: Run Example
        run: |
          set -euo pipefail
          : "${EXTRACTED_NANVIX_HOME:?Missing extracted artifact path}"
          LOCAL_TOOLCHAIN="$HOME/toolchain"
          if [[ ! -d "$LOCAL_TOOLCHAIN" ]]; then
            echo "::error::Local Nanvix toolchain not found at $LOCAL_TOOLCHAIN"
            exit 1
          fi
          NANVIX_HOME="${EXTRACTED_NANVIX_HOME}" \
          NANVIX_TOOLCHAIN="$LOCAL_TOOLCHAIN" \
          DOCKER=no \
          VERBOSE=yes \
          make run

      - name: Cleanup Dangling Resources
        if: always()
        run: |
          set -euo pipefail
          sudo find /tmp -maxdepth 1 -type d -name 'nvx:*' -exec rm -rf {} + 2>/dev/null || true

      - name: Install Artifacts
        run: |
          set -euo pipefail
          : "${EXTRACTED_NANVIX_HOME:?Missing extracted artifact path}"
          LOCAL_TOOLCHAIN="$HOME/toolchain"
          if [[ ! -d "$LOCAL_TOOLCHAIN" ]]; then
            echo "::error::Local Nanvix toolchain not found at $LOCAL_TOOLCHAIN"
            exit 1
          fi
          NANVIX_HOME="${EXTRACTED_NANVIX_HOME}" \
          NANVIX_TOOLCHAIN="$LOCAL_TOOLCHAIN" \
          DOCKER=no \
          VERBOSE=yes \
          make install

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rusty_v8-nanvix-build-${{ matrix.artifact_name }}
          path: |
            ci-logs
            dist
          if-no-files-found: warn

  report-minor-release-failure:
    needs:
      - discover-artifacts
      - build
    if: >-
      ${{ always() && github.event_name == 'repository_dispatch' &&
          (github.event.action == 'nanvix-minor-release' || github.event.action == 'nanvix-major-release') &&
          (needs['discover-artifacts'].result == 'failure' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        env:
          DISCOVER_RESULT: ${{ needs['discover-artifacts'].result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isMajor = context.payload.action === 'nanvix-major-release';
            const releaseType = isMajor ? 'major' : 'minor';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = `Nanvix ${releaseType} release CI failure (run ${context.runNumber})`;
            const body = [
              `The Nanvix ${releaseType} release CI workflow failed.`,
              `- Run: [#${context.runNumber}](${runUrl})`,
              `- SHA: ${context.sha}`,
              `- discover-artifacts: ${process.env.DISCOVER_RESULT}`,
              `- build: ${process.env.BUILD_RESULT}`,
              '',
              'Please investigate and take any corrective actions.'
            ].join('\n');
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              assignees: ['ppenna']
            });
